name = "pelote"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Base de données : `npx wrangler d1 create pelote`, puis colle l'id ici.
[[d1_databases]]
binding = "DB"
database_name = "pelote"
database_id = "REMPLACE-MOI-PAR-L-ID-D1"
migrations_dir = "migrations"

# Images du Panier : `npx wrangler r2 bucket create pelote-panier`
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "pelote-panier"

[vars]
# Domaine de ton équipe Cloudflare Access, ex. "monequipe.cloudflareaccess.com"
ACCESS_TEAM_DOMAIN = ""
# "Application Audience (AUD) Tag" de l'application Access
ACCESS_AUD = ""
# L'utilisateur simulé pour le dev local vit dans .dev.vars (jamais déployé).
